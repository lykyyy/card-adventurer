#step-content{min-height:380px;padding:16px 20px}

@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.section-title{font-size:16px;color:#ffd700;margin-bottom:12px;text-align:center;letter-spacing:1px}

const ATTR_NAMES=['力量STR','敏捷DEX','体质CON','智力INT','感知WIS','魅力CHA'];
const ATTR_EMOJIS=['💪','🏃','🛡️','🧠','👁️','👑'];

let s={step:1,race:null,prof:null,points:8,attrs:{},skills:[],feat:null,origin:null,childhood:null,youth:null,awakening:null,tags:[],deckParams:null};

function init(){buildProgress();renderStep();}
function $S(id){return document.getElementById(id);}
function mod(v){return Math.floor((v-10)/2);}

function buildProgress(){
let b=$S('progress-bar');b.innerHTML='';
for(let i=1;i<=10;i++){
let d=document.createElement('div');
d.className='step-dot';
d.textContent=i;
if(i===6)d.classList.add('phase-sep');
if(i<s.step)d.classList.add('done');
if(i===s.step)d.classList.add('active');
b.appendChild(d);
if(i<10){let l=document.createElement('div');l.className='step-line';if(i<s.step)l.classList.add('done');b.appendChild(l);}
}
$S('step-label').textContent=LABELS[s.step];
$S('phase-label').textContent=PHASES[s.step];
let n=NARRATIVES[s.step];$S('step-narrative').textContent=n?('"'+n+'"'):'';
}

function renderStep(){
buildProgress();
let ct=$S('step-content'),bp=$S('btn-prev'),bn=$S('btn-next');
bp.disabled=(s.step===1);
bn.disabled=false;
bn.style.display='';
switch(s.step){
case 1:renderRace(ct);bn.disabled=!s.race;bn.textContent='下一步';break;
case 2:renderProf(ct);bn.disabled=!s.prof;bn.textContent='下一步';break;
case 3:renderAttr(ct);bn.textContent='确认分配';bn.disabled=false;break;
case 4:renderSkills(ct);bn.textContent='下一步';bn.disabled=s.skills.length<2;break;
case 5:renderFeat(ct);bn.textContent='下一步';bn.disabled=!s.feat;break;
case 6:renderOrigin(ct);bn.textContent='下一步';bn.disabled=!s.origin;break;
case 7:renderChildhood(ct);bn.textContent='下一步';bn.disabled=!s.childhood;break;
case 8:renderYouth(ct);bn.textContent='下一步';bn.disabled=!s.youth;break;
case 9:renderAwaken(ct);bn.textContent='下一步';bn.disabled=!s.awakening;break;
case 10:calcFinal();renderFinal(ct);bn.style.display='none';break;
}
if(s.step===10){$S('nav-bar').style.display='none'}else{$S('nav-bar').style.display='flex'}
}

function goNext(){
switch(s.step){
case 1:if(!s.race)return;resetAttrs();break;
case 2:if(!s.prof)return;resetAttrs();break;
case 4:if(s.skills.length<2)return;break;
case 5:if(!s.feat)return;break;
case 6:if(!s.origin)return;break;
case 7:if(!s.childhood)return;break;
case 8:if(!s.youth)return;break;
case 9:if(!s.awakening)return;break;
}
if(s.step<10)s.step++;
renderStep();
}

function goPrev(){if(s.step>1)s.step--;renderStep();}

function resetAttrs(){
let r=RACES.find(x=>x.id===s.race);
s.attrs={str:r.str,dex:r.dex,con:r.con,intel:r.intel,wis:r.wis,cha:r.cha};
s.points=8;
}

// Step 1: Race
function renderRace(ct){
let r=RACES;
ct.innerHTML='<div class="step-pane active"><div class="section-title">选择你的种族</div><div class="card-grid grid-4">'+r.map(x=>{
let sel=s.race===x.id,vs=[x.str,x.dex,x.con,x.intel,x.wis,x.cha],mx=Math.max(...vs);
return'<div class="card-option'+(sel?' selected':'')+'" onclick="s.race=\''+x.id+'\';renderStep()"><span class="emoji">'+x.emoji+'</span><div class="name">'+x.name+'</div><div class="stats-row">'+ATTR_NAMES.map((a,i)=>'<span class="stat-tag'+(vs[i]===mx?' highlight':'')+'">'+a.split(' ')[0]+':'+vs[i]+'</span>').join('')+'</div><div class="bonus">🏷 '+x.passive+(x.fixedSkill?' | 🔒 固定技能:'+SKILLS.find(s=>s.id===x.fixedSkill).name:'')+'</div></div>';
}).join('')+'</div></div>';
}

// Step 2: Profession
function renderProf(ct){
let p=PROFESSIONS;
ct.innerHTML='<div class="step-pane active"><div class="section-title">选择你的职业</div><div class="card-grid grid-4">'+p.map(x=>{
let sel=s.prof===x.id;
return'<div class="card-option'+(sel?' selected':'')+'" onclick="s.prof=\''+x.id+'\';s.skills=[];s.feat=null;renderStep()"><span class="emoji">'+x.emoji+'</span><div class="name">'+x.name+'</div><div class="stats-row"><span class="stat-tag">HP:'+x.hp+'</span><span class="stat-tag">CE:'+x.ce+'</span><span class="stat-tag highlight">'+x.energy+'</span></div><div class="desc">'+x.desc+'</div></div>';
}).join('')+'</div></div>';
}

// Step 3: Attributes
function renderAttr(ct){
let k=ATTR_KEYS,n=ATTR_NAMES,e=ATTR_EMOJIS;
let maxV=16,baseV=RACES.find(x=>x.id===s.race);
ct.innerHTML='<div class="step-pane active"><div class="section-title">属性分配（点购制）</div><div id="points-left">剩余点数: <b>'+s.points+'</b> / 8</div><div id="attr-panel">'+k.map((kk,i)=>{
let v=s.attrs[kk],m=mod(v);
return'<div class="attr-row"><span class="attr-icon">'+e[i]+'</span><span class="attr-name">'+n[i]+'</span><button onclick="attrDec(\''+kk+'\')" '+(v<=baseV[kk]?'disabled':'')+'>-</button><span class="attr-val">'+v+'</span><button onclick="attrInc(\''+kk+'\')" '+(v>=maxV||s.points<=0?'disabled':'')+'>+</button><span class="attr-mod">'+(m>=0?'+':'')+m+'</span><div class="attr-bar"><div class="attr-fill" style="width:'+((v-6)/14*100)+'%"></div></div></div>';
}).join('')+'</div></div>';
}

function attrInc(kk){if(s.points>0&&s.attrs[kk]<16){s.attrs[kk]++;s.points--;renderStep();}}
function attrDec(kk){let b=RACES.find(x=>x.id===s.race)[kk];if(s.attrs[kk]>b){s.attrs[kk]--;s.points++;renderStep();}}

// Step 4: Skills
function renderSkills(ct){
let pool=PROF_SKILLS[s.prof],rc=RACES.find(x=>x.id===s.race),fixed=rc.fixedSkill;
let need=2,cur=s.skills.length,full=cur>=need;
ct.innerHTML='<div class="step-pane active"><div class="section-title">选择职业技能 (4选2)</div><div id="sk-counter">已选 <b>'+cur+'</b> / '+need+(fixed?' <span style="color:#ffd700;font-size:11px">（种族固定: '+SKILLS.find(x=>x.id===fixed).name+'）</span>':'')+'</div><div class="skill-list">'+SKILLS.filter(sk=>pool.includes(sk.id)).map(sk=>{
let checked=s.skills.includes(sk.id),disabled=!checked&&full;
return'<div class="skill-item"><input type="checkbox" '+(checked?'checked':'')+' '+(disabled?'disabled':'')+' onchange="toggleSkill(\''+sk.id+'\')"><label><span class="sk-name">'+sk.name+'</span><span class="sk-attrs">'+sk.attrs+'</span></label></div>';
}).join('')+'</div></div>';
}
function toggleSkill(id){let i=s.skills.indexOf(id);if(i>=0)s.skills.splice(i,1);else if(s.skills.length<2)s.skills.push(id);renderStep();}

// Step 5: Feat
function renderFeat(ct){
let feats=PROF_FEATS[s.prof];
ct.innerHTML='<div class="step-pane active"><div class="section-title">选择职业专长 (3选1)</div><div class="card-grid grid-3">'+feats.map(f=>{
let sel=s.feat===f.id;
return'<div class="card-option'+(sel?' selected':'')+'" onclick="s.feat=\''+f.id+'\';renderStep()"><div class="name">'+f.name+'</div><div class="desc">'+f.desc+'</div><div class="bonus" style="font-size:9px">'+f.id+'</div></div>';
}).join('')+'</div></div>';
}

// Step 6: Origin
function renderOrigin(ct){
let o=ORIGINS;
ct.innerHTML='<div class="step-pane active"><div class="section-title">出身背景</div><div class="card-grid grid-6">'+o.map(x=>{
let sel=s.origin===x.id,sc=CARDS[x.strategyCard],sk=SKILLS.find(sk=>sk.id===x.originSkill);
return'<div class="card-option'+(sel?' selected':'')+'" onclick="s.origin=\''+x.id+'\';renderStep()"><span class="emoji">'+x.emoji+'</span><div class="name">'+x.name+'</div><div class="desc">💰 '+x.gold+'G | '+x.trait+'</div><div class="bonus">🃏 '+sc.emoji+' '+sc.name+' | 📖 '+sk.name+'</div><div class="desc" style="color:#ffd700;font-size:9px">"'+x.story+'"</div></div>';
}).join('')+'</div></div>';
}

// Step 7-9: Life events
function renderChildhood(ct){renderLifeStep(ct,CHILDHOOD,s.childhood,'童年经历','childhood')}
function renderYouth(ct){renderLifeStep(ct,YOUTH,s.youth,'青年抉择','youth')}
function renderAwaken(ct){renderLifeStep(ct,AWAKENING,s.awakening,'觉醒使命','awakening')}

function renderLifeStep(ct,opts,curSel,title,stateKey){
ct.innerHTML='<div class="step-pane active"><div class="section-title">'+title+'</div><div class="card-grid grid-3">'+opts.map(o=>{
let isSel=curSel===o.key,cd=CARDS[o.card];
return'<div class="card-option'+(isSel?' selected':'')+'" onclick="s.'+stateKey+'=\''+o.key+'\';renderStep()"><div class="name">'+o.name+'</div><div class="desc">'+o.narrative+'</div><div style="margin-top:6px"><span class="tag-badge tag-warrior">🏷 '+o.tag+'</span></div><div class="bonus">🃏 '+cd.emoji+' '+cd.name+' | ✚ '+Object.entries(o.attrBonus).map(([k,v])=>k.toUpperCase()+'+'+v).join(' ')+'</div></div>';
}).join('')+'</div></div>';
}

// Step 10: Final
function calcFinal(){
let rc=RACES.find(x=>x.id===s.race),or=ORIGINS.find(x=>x.id===s.origin);
let evs=[{step:'childhood',data:CHILDHOOD,sel:s.childhood},{step:'youth',data:YOUTH,sel:s.youth},{step:'awakening',data:AWAKENING,sel:s.awakening}];
s.tags=[];
let bonusAttrs={str:0,dex:0,con:0,intel:0,wis:0,cha:0};
evs.forEach(ev=>{let opt=ev.data.find(x=>x.key===ev.sel);if(opt){s.tags.push(opt.tag);Object.entries(opt.attrBonus).forEach(([k,v])=>bonusAttrs[k]+=v)}});
let finalAttrs={};ATTR_KEYS.forEach(k=>finalAttrs[k]=s.attrs[k]+(bonusAttrs[k]||0));
let mods={};ATTR_KEYS.forEach(k=>mods[k]=mod(finalAttrs[k]));
let prof=PROFESSIONS.find(x=>x.id===s.prof);
let hp=prof.hp+mods.con*5,ce=prof.ce;
let mana=null;if(s.prof==='P-002')mana=Math.min(10,5+mods.intel);else if(s.prof==='P-004')mana=Math.min(8,4+mods.wis);
let feats=[s.feat];
evs.forEach(ev=>{let opt=ev.data.find(x=>x.key===ev.sel);if(opt&&opt.bgFeat)feats.push(opt.bgFeat)});
let deck=[];
[prof.cards[0],prof.cards[1],prof.cards[2],'C-004','C-072'].forEach(x=>deck.push(x));
evs.forEach(ev=>{let opt=ev.data.find(x=>x.key===ev.sel);if(opt)deck.push(opt.card)});
if(or.strategyCard)deck.push(or.strategyCard);
let allSkills=[...new Set([...(rc.fixedSkill?[rc.fixedSkill]:[]),...s.skills,or.originSkill])];
let tagStr=s.tags.join('/'),title=or.name+'·'+tagStr+'·'+prof.name;
s.deckParams={title,prof:prof.name,hp,ce,mana,stats:finalAttrs,modifiers:mods,feats,deck,skills:allSkills,gold:or.gold,origin:or,race:rc,tags:s.tags,narrative:or.story+'。'+evs.map(e=>{let o=e.data.find(x=>x.key===e.sel);return o?o.narrative:'';}).join('。')+'。以"'+title+'"之名踏上星界冒险。'};
}

function renderFinal(ct){
let p=s.deckParams,combat=[],tactic=[];
p.deck.forEach(cid=>{let cd=CARDS[cid];if(!cd)return;if(cd.type==='tactic')tactic.push({id:cid,...cd});else combat.push({id:cid,...cd})});
ct.innerHTML='<div class="step-pane active"><div class="final-header"><h2>'+p.title+'</h2></div><div class="panel-section"><h3>属性</h3><div class="attr-grid">'+ATTR_KEYS.map((k,i)=>'<div class="attr-cell"><div class="attr-label">'+ATTR_NAMES[i]+'</div><div class="attr-val">'+p.stats[k]+'</div><div class="attr-mod">'+(p.modifiers[k]>=0?'+':'')+p.modifiers[k]+'</div></div>').join('')+'</div></div><div class="panel-section"><h3>战斗数据</h3><div class="derived-row"><div class="derived-item"><div class="val">'+p.hp+'</div><div class="lbl">HP</div></div><div class="derived-item"><div class="val">'+p.ce+'</div><div class="lbl">CE</div></div><div class="derived-item"><div class="val">'+(p.mana||'-')+'</div><div class="lbl">法力值</div></div><div class="derived-item"><div class="val">'+p.prof+'</div><div class="lbl">职业</div></div><div class="derived-item"><div class="val">💰'+p.gold+'G</div><div class="lbl">金币</div></div></div></div><div class="panel-section"><h3>技能 ('+p.skills.length+')</h3><div style="display:flex;flex-wrap:wrap;gap:4px">'+p.skills.map(sid=>{let sk=SKILLS.find(x=>x.id===sid);if(!sk)return'';return'<span class="tag-badge tag-scholar">📖 '+sk.name+'</span>'}).filter(Boolean).join('')+'</div></div><div class="panel-section"><h3>专长 ('+p.feats.length+')</h3><div style="display:flex;flex-wrap:wrap;gap:4px">'+p.feats.map(f=>'<span class="tag-badge tag-warrior">⭐ '+f+'</span>').join('')+'</div></div><div class="panel-section"><h3>战斗牌库 ('+combat.length+'张)</h3><div class="deck-grid">'+combat.map(c=>'<div class="deck-card" title="'+c.effect+'"><span class="card-icon">'+c.emoji+'</span><div class="card-name">'+c.name+'</div><div class="card-cost">CE '+c.cost+'</div><span class="type-'+c.type+'">'+c.type+'</span></div>').join('')+'</div></div><div class="panel-section"><h3>战略牌库 ('+tactic.length+'张)</h3><div class="deck-grid">'+tactic.map(c=>'<div class="deck-card" title="'+c.effect+'"><span class="card-icon">'+c.emoji+'</span><div class="card-name">'+c.name+'</div><div class="card-cost">战略</div><span class="type-tactic">tactic</span></div>').join('')+'</div></div><div class="panel-section" style="text-align:center"><p style="font-size:12px;color:#a29bfe;line-height:1.6">"'+p.narrative+'"</p></div><button id="btn-launch" onclick="launch()">🚀 踏上冒险</button></div>';
}

function launch(){
let p=s.deckParams;
alert('角色创建完成！\n'+p.title+'\nHP:'+p.hp+' CE:'+p.ce+' 法力:'+(p.mana||'—')+'\n职业:'+p.prof+' 金币:'+p.gold+'\n牌库:'+p.deck.length+'张\n\nMVP阶段：请返回 root.html 继续游戏');
window.location.href='./root.html?char='+encodeURIComponent(JSON.stringify(p));
}

init();
</script>
</body>
</html>
