<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌冒险者 · Card Adventurer</title>
    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Pirata+One&family=Noto+Serif+SC:wght@400;600;700;900&family=MedievalSharp&display=swap');

:root {
  /* === 色彩系统 === */
  /* 主色调 - 欺诈之地赤陶/琥珀红 */
  --color-primary: #c4573a;
  --color-primary-hover: #d96b4c;
  --color-primary-dark: #9a3f28;
  --color-primary-glow: rgba(196, 87, 58, 0.4);

  /* 背景色 - 深紫黑星空 */
  --color-bg: #1a1520;
  --color-bg-deep: #120e18;
  --color-bg-surface: #2a2338;
  --color-bg-elevated: #352d45;
  --color-bg-panel: #2d2540;
  --color-bg-overlay: rgba(10, 8, 16, 0.85);

  /* 边框色 */
  --color-border: #4a3f5c;
  --color-border-light: #5e5272;
  --color-border-dark: #2d2538;
  --color-border-gold: #a08040;

  /* 文字色 */
  --color-text: #e8e0f0;
  --color-text-secondary: #a89cc0;
  --color-text-muted: #6e6088;
  --color-text-gold: #f0c860;
  --color-text-dark: #1a1520;

  /* 职业色 */
  --color-warrior: #d4523a;
  --color-warrior-bg: rgba(212, 82, 58, 0.15);
  --color-rogue: #4ecdc4;
  --color-rogue-bg: rgba(78, 205, 196, 0.15);
  --color-mage: #9b7fd4;
  --color-mage-bg: rgba(155, 127, 212, 0.15);
  --color-priest: #f0c040;
  --color-priest-bg: rgba(240, 192, 64, 0.15);

  /* 状态色 */
  --color-success: #5a9e3a;
  --color-success-bg: rgba(90, 158, 58, 0.15);
  --color-warning: #d49030;
  --color-warning-bg: rgba(212, 144, 48, 0.15);
  --color-danger: #c03848;
  --color-danger-bg: rgba(192, 56, 72, 0.15);
  --color-info: #5890c8;
  --color-info-bg: rgba(88, 144, 200, 0.15);

  /* 稀有度色 */
  --color-common: #8a8090;
  --color-uncommon: #4a90d4;
  --color-rare: #9b50d4;
  --color-legendary: #d4a020;

  /* 燃素虹彩 */
  --gradient-phlogiston: linear-gradient(135deg, #c4573a, #d49030, #f0c040, #4ecdc4, #5890c8, #9b7fd4);

  /* === 字体系统 === */
  --font-display: 'Cinzel', 'Noto Serif SC', serif;
  --font-pirate: 'Pirata One', 'Noto Serif SC', serif;
  --font-body: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  --font-medieval: 'MedievalSharp', 'Courier New', monospace;

  /* === 尺寸系统 === */
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-card: 8px;
  --radius-panel: 6px;
  --radius-btn: 4px;

  /* === 阴影 === */
  --shadow-panel: 0 4px 20px rgba(0, 0, 0, 0.5);
  --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-card-hover: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--color-primary-glow);
  --shadow-btn: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-glow-gold: 0 0 20px rgba(240, 200, 96, 0.4);
  --shadow-glow-primary: 0 0 20px var(--color-primary-glow);

  /* === 边框装饰 === */
  --border-rivet: 2px solid var(--color-border);
  --border-panel: 3px solid var(--color-border-dark);
  --border-panel-inner: 1px solid var(--color-border-light);
  --border-gold: 2px solid var(--color-border-gold);

  /* === 动画 === */
  --transition-fast: 0.15s ease;
  --transition-base: 0.25s ease;
  --transition-slow: 0.4s ease;
}

/* === 全局重置 === */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
}

/* === 页面容器 === */
.page-container {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: var(--color-bg-deep);
}

/* === 背景图层 === */
.bg-layer {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 0;
}

.bg-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(26, 21, 32, 0.3) 0%,
    rgba(26, 21, 32, 0.1) 40%,
    rgba(26, 21, 32, 0.7) 100%
  );
}

/* === 手绘面板样式 === */
.panel {
  background: var(--color-bg-panel);
  border: var(--border-panel);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-panel);
  position: relative;
}

.panel::before {
  content: '';
  position: absolute;
  inset: 3px;
  border: var(--border-panel-inner);
  border-radius: calc(var(--radius-panel) - 2px);
  pointer-events: none;
}

/* 面板铆钉装饰 */
.panel-rivets::before {
  content: '';
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  bottom: 8px;
  border: 1px solid rgba(94, 82, 114, 0.3);
  border-radius: 3px;
  pointer-events: none;
}

.panel-header {
  padding: 12px 20px;
  border-bottom: 2px solid var(--color-border-dark);
  background: linear-gradient(180deg, rgba(196, 87, 58, 0.15) 0%, transparent 100%);
  position: relative;
}

.panel-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 20%;
  right: 20%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
}

.panel-title {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-text-gold);
  text-transform: uppercase;
  letter-spacing: 2px;
}

.panel-body {
  padding: 16px 20px;
}

/* === 按钮样式 === */
.btn {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  padding: 12px 28px;
  border: 3px solid var(--color-border-dark);
  border-radius: var(--radius-btn);
  cursor: pointer;
  transition: all var(--transition-base);
  text-transform: uppercase;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-btn);
}

.btn::before {
  content: '';
  position: absolute;
  inset: 1px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: calc(var(--radius-btn) - 1px);
  pointer-events: none;
}

.btn-primary {
  background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: var(--color-text);
  border-color: #6a2a18;
}

.btn-primary:hover {
  background: linear-gradient(180deg, var(--color-primary-hover) 0%, var(--color-primary) 100%);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow-primary);
}

.btn-secondary {
  background: linear-gradient(180deg, var(--color-bg-elevated) 0%, var(--color-bg-surface) 100%);
  color: var(--color-text);
  border-color: var(--color-border-dark);
}

.btn-secondary:hover {
  background: linear-gradient(180deg, var(--color-border) 0%, var(--color-bg-elevated) 100%);
  transform: translateY(-2px);
}

.btn-gold {
  background: linear-gradient(180deg, #e8b838 0%, #c89820 100%);
  color: var(--color-text-dark);
  border-color: #8a6810;
}

.btn-gold:hover {
  background: linear-gradient(180deg, #f0c848 0%, #d8a828 100%);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow-gold);
}

.btn-danger {
  background: linear-gradient(180deg, var(--color-danger) 0%, #902838 100%);
  color: var(--color-text);
  border-color: #5a1820;
}

.btn-sm {
  padding: 6px 14px;
  font-size: 0.8rem;
}

.btn-lg {
  padding: 16px 40px;
  font-size: 1.2rem;
}

/* === 卡牌样式 === */
.card {
  width: 140px;
  height: 200px;
  background: var(--color-bg-surface);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-card);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all var(--transition-base);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-12px) scale(1.05);
  box-shadow: var(--shadow-card-hover);
  z-index: 10;
}

.card-warrior { border-color: var(--color-warrior); }
.card-warrior:hover { box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 20px rgba(212,82,58,0.5); }
.card-rogue { border-color: var(--color-rogue); }
.card-rogue:hover { box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 20px rgba(78,205,196,0.5); }
.card-mage { border-color: var(--color-mage); }
.card-mage:hover { box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 20px rgba(155,127,212,0.5); }
.card-priest { border-color: var(--color-priest); }
.card-priest:hover { box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 20px rgba(240,192,64,0.5); }

.card-common { border-color: var(--color-common); }
.card-uncommon { border-color: var(--color-uncommon); }
.card-rare { border-color: var(--color-rare); box-shadow: 0 0 15px rgba(155,80,212,0.3); }
.card-legendary {
  border-color: var(--color-legendary);
  box-shadow: 0 0 20px rgba(212,160,32,0.4);
  background: linear-gradient(135deg, #3a2a10, var(--color-bg-surface), #3a2a10);
}

.card-cost {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 32px;
  height: 32px;
  background: radial-gradient(circle, #f0c860 0%, #c89820 60%, #8a6810 100%);
  border: 2px solid #5a4010;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-medieval);
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--color-text-dark);
  z-index: 2;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.3);
}

.card-art {
  height: 90px;
  background: linear-gradient(180deg, #1a1520 0%, #2a2338 100%);
  border-bottom: 2px solid var(--color-border-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  position: relative;
  overflow: hidden;
}

.card-art::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.5) 100%);
}

.card-name {
  font-family: var(--font-pirate);
  font-size: 0.9rem;
  text-align: center;
  padding: 6px 4px 2px;
  color: var(--color-text);
  border-bottom: 1px solid rgba(74,63,92,0.5);
}

.card-type {
  font-size: 0.65rem;
  text-align: center;
  padding: 2px;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  background: rgba(0,0,0,0.3);
}

.card-text {
  font-size: 0.7rem;
  padding: 4px 6px;
  text-align: center;
  color: var(--color-text-secondary);
  line-height: 1.3;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* === 资源/状态条 === */
.resource-bar {
  height: 20px;
  background: var(--color-bg-deep);
  border: 2px solid var(--color-border-dark);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}

.resource-bar-fill {
  height: 100%;
  border-radius: 1px;
  transition: width var(--transition-slow);
  position: relative;
}

.resource-bar-fill::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  right: 2px;
  height: 6px;
  background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent);
  border-radius: 2px;
}

.resource-bar-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  z-index: 1;
}

.bar-hp { background: linear-gradient(90deg, #3a8a2a, #5abe3a); }
.bar-shield { background: linear-gradient(90deg, #2a5a9a, #4a8ad4); }
.bar-energy { background: linear-gradient(90deg, #8a5a2a, #d4a030); }
.bar-mana { background: linear-gradient(90deg, #5a3a8a, #9b50d4); }
.bar-rage { background: linear-gradient(90deg, #8a2a2a, #d44040); }
.bar-combo { background: linear-gradient(90deg, #2a7a6a, #4ecdc4); }

/* === 资源图标/宝石 === */
.gem {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-weight: bold;
  font-size: 0.8rem;
  border: 2px solid;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.3);
}

.gem-energy {
  background: radial-gradient(circle, #f0c860, #c89820);
  border-color: #5a4010;
  color: var(--color-text-dark);
  font-family: var(--font-medieval);
}

/* === 地图节点 === */
.map-node {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 3px solid var(--color-border);
  background: var(--color-bg-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  position: relative;
  cursor: pointer;
  transition: all var(--transition-base);
}

.map-node-current {
  border-color: var(--color-primary);
  box-shadow: 0 0 20px var(--color-primary-glow);
  animation: pulse-glow 2s ease-in-out infinite;
}

.map-node-visited {
  opacity: 0.5;
  border-color: var(--color-border);
}

.map-node-available {
  border-color: var(--color-success);
  box-shadow: 0 0 10px rgba(90,158,58,0.4);
}

.map-node-locked {
  opacity: 0.3;
  cursor: not-allowed;
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px var(--color-primary-glow); }
  50% { box-shadow: 0 0 35px var(--color-primary-glow), 0 0 60px rgba(196,87,58,0.2); }
}

/* === 战斗单位 === */
.combat-unit {
  background: var(--color-bg-panel);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 8px;
  position: relative;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.combat-unit-enemy {
  border-color: var(--color-danger);
}

.combat-unit-player {
  border-color: var(--color-primary);
}

.unit-portrait {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 2px solid var(--color-border-gold);
  background: var(--color-bg-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  margin: 0 auto;
}

.unit-name {
  font-family: var(--font-display);
  font-size: 0.85rem;
  text-align: center;
  color: var(--color-text-gold);
}

.unit-intent {
  position: absolute;
  top: -8px;
  right: -8px;
  background: var(--color-warning);
  border: 2px solid #8a5a10;
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 0.7rem;
  font-weight: bold;
  color: var(--color-text-dark);
}

/* === 状态效果徽章 === */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 600;
  border: 1px solid;
}

.status-buff {
  background: var(--color-success-bg);
  border-color: var(--color-success);
  color: var(--color-success);
}

.status-debuff {
  background: var(--color-danger-bg);
  border-color: var(--color-danger);
  color: var(--color-danger);
}

/* === 进度条样式 === */
.progress-track {
  height: 8px;
  background: var(--color-bg-deep);
  border-radius: 4px;
  border: 1px solid var(--color-border-dark);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width var(--transition-slow);
}

/* === 工具类 === */
.text-gold { color: var(--color-text-gold); }
.text-primary { color: var(--color-primary); }
.text-muted { color: var(--color-text-muted); }
.text-warrior { color: var(--color-warrior); }
.text-rogue { color: var(--color-rogue); }
.text-mage { color: var(--color-mage); }
.text-priest { color: var(--color-priest); }

.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-sm { gap: 8px; }
.gap-md { gap: 16px; }
.gap-lg { gap: 24px; }

.text-center { text-align: center; }
.w-full { width: 100%; }
.h-full { height: 100%; }

.font-display { font-family: var(--font-display); }
.font-pirate { font-family: var(--font-pirate); }
.font-medieval { font-family: var(--font-medieval); }

/* === 星空粒子动画 === */
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 3s ease-in-out infinite;
}

/* === 装饰角饰 === */
.corner-ornament {
  position: absolute;
  width: 32px;
  height: 32px;
  border: 2px solid var(--color-border-gold);
  opacity: 0.6;
}

.corner-ornament-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
.corner-ornament-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
.corner-ornament-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
.corner-ornament-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

/* === 滚动条 === */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--color-bg-deep);
}

::-webkit-scrollbar-thumb {
  background: var(--color-border);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--color-border-light);
}

      content: '';
      position: absolute;
      inset: 4px;
      border: 2px solid rgba(160, 128, 64, 0.5);
      border-radius: 50%;
      box-shadow:
        0 0 0 1px rgba(240, 200, 96, 0.2) inset,

    .compass::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 50%;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, var(--color-text-gold) 0%, transparent 100%);
      opacity: 0.6;

      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }

    .corner {
      position: absolute;

    .corner-bl { bottom: 20px; left: 20px;    border-right: none; border-top: none; }
    .corner-br { bottom: 20px; right: 20px;   border-left: none;  border-top: none; }

    /* 角饰小圆点 */
    .corner::before,
    .corner::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--color-text-gold);
      border-radius: 50%;
      opacity: 0.7;

    .corner-bl::before { bottom: -3px; left: -3px; }
    .corner-bl::after  { bottom: -3px; right: -3px; }
    .corner-br::before { bottom: -3px; right: -3px; }
